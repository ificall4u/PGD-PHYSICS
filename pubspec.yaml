name: pgd_physics
description: PGD Physics — ABUAD study companion. Learn with Nova.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  http: ^1.2.2
  flutter_math_fork: ^0.7.2
  flutter_markdown: ^0.7.3+1
  markdown: ^7.2.2
  intl: ^0.19.0
  percent_indicator: ^4.2.3
  confetti: ^0.7.0
  flutter_animate: ^4.5.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  uuid: ^4.5.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
