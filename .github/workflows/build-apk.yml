name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Ensure Android platform project
        run: |
          # Fills missing Gradle/Android files without wiping lib/ or pubspec.yaml
          flutter create . --project-name pgd_physics --org com.pgdphysics.app --platforms=android
          # Keep our app label if create overwrote something critical
          test -f pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgd-physics-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
